name: Sync upstream

on:
  schedule:
    # 每天新加坡时间 09:20
    - cron: "20 9 * * *"
      timezone: "Asia/Singapore"

  # 允许在 Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch and merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/lwouis/alt-tab-macos.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "master already contains the latest upstream changes"
            exit 0
          fi

          git merge --no-edit upstream/master
          git push origin HEAD:master
